repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]


  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: '7ff8d35'
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.3.15
          - typer>=0.27.2
          - rich>=13.0
          - pytest>=9.1.1
          - types-PyYAML
          - types-psutil
